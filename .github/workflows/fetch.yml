name: fetch-ad-assets
on: { push: { branches: [ad-assets] } }
permissions: { contents: write }
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[assets]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ad-img
          while read -r name url; do curl -fsSL "$url" -o "ad-img/$name"; done < urls.txt
          ls -la ad-img
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add ad-img && git commit -m "Ad product photos [assets]" && git push
